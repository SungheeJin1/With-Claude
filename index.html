<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11132a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="품사 탐험대">
<title>품사 탐험대 · 쉬운 영문법</title>
<meta name="description" content="초등학생도 이해하는 영어 8품사 문법 설명과 웹툰">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <a class="brand-link" href="#home" aria-label="품사 탐험대 처음 화면">
      <span class="brand-logo">ABC</span>
      <div>
        <h1>품사 탐험대</h1>
        <p>영어 문장을 만드는 8명의 친구들을 만나 보아요!</p>
      </div>
    </a>
    <span class="crumb" id="crumb"></span>
    <div class="head-actions">
      <button type="button" class="icon-btn" id="searchBtn" aria-label="용어 검색" title="용어 검색" aria-haspopup="dialog">🔍</button>
      <a class="icon-btn home-btn" href="#home" aria-label="처음으로" title="처음으로">🏠</a>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="이 품사의 목차"></aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div class="side-backdrop" id="sideBackdrop"></div>
<div class="search-panel" id="searchPanel" role="dialog" aria-modal="true" aria-labelledby="searchTitle" hidden>
  <div class="search-box">
    <form class="search panel-search" id="panelSearchForm" data-search role="search" autocomplete="off">
      <label class="sr-only" for="panelSearchInput">용어 검색</label>
      <input id="panelSearchInput" type="search" placeholder="용어 검색 (예: 관계대명사)" enterkeyhint="search" spellcheck="false">
      <button type="submit">검색</button>
      <button type="button" class="search-close" id="searchClose" aria-label="검색 닫기">✕</button>
    </form>
    <h2 id="searchTitle" class="search-title"></h2>
    <ol class="search-results" id="searchResults"></ol>
  </div>
</div>
<button class="side-btn" id="sideBtn" type="button" aria-controls="side" aria-expanded="false">☰ 목차</button>

<button class="to-top" id="toTop" aria-label="맨 위로">▲</button>

<footer class="site-footer">
  <p>🔊 버튼을 누르면 예문을 영어로 읽어 줘요. · 웹툰 속 단어 친구들의 이야기로 문법을 기억해요!</p>
</footer>

<script src="js/helpers.js"></script>
<script src="js/data/01-noun.js"></script>
<script src="js/data/02-pronoun.js"></script>
<script src="js/data/03-adjective.js"></script>
<script src="js/data/04-adverb.js"></script>
<script src="js/data/05-verb.js"></script>
<script src="js/data/06-preposition.js"></script>
<script src="js/data/07-conjunction.js"></script>
<script src="js/data/08-interjection.js"></script>
<script src="js/data/unscramble.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
