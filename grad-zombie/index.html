<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11132a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="논문좀비">
<title>논문 좀비</title>
<meta name="description" content="대학원 준비를 안 하면 좀비가 쫓아와요. 매일 논문을 열고 묻고 분석해서 도망치세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="logo" type="button" data-go="home" aria-label="홈으로">논문-좀비</button>
  <button class="top-streak" id="topStreak" type="button" data-go="zombie" aria-label="좀비 추격 보기" hidden></button>
  <button class="burger" id="burger" type="button" aria-label="메뉴 열기" aria-controls="drawer" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<nav class="drawer" id="drawer" aria-label="메뉴" hidden>
  <button type="button" data-go="home"><b>✓</b> 오늘의 미션</button>
  <button type="button" data-go="zombie"><b>🧟</b> 좀비 추격</button>
  <button type="button" data-go="library"><b>📚</b> 논문 서재</button>
  <button type="button" data-go="add"><b>＋</b> 논문 추가 · 분석</button>
  <button type="button" data-go="history"><b>📅</b> 출석 기록</button>
  <button type="button" data-go="settings"><b>⚙</b> 설정</button>
</nav>
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

<main id="main" class="wrap" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/paper.js"></script>
<script src="js/chase.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
