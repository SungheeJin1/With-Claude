<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신경 갈림길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column "slide" — oscilloscope trace on top, the question as the axon stem, two boutons (choices) at the fork below. */
:root {
  --bg: #f3f1f6;          /* glass slide */
  --panel: #fbfaFD;
  --ink: #221d2e;
  --muted: #6c6479;
  --line: #d9d3e2;
  --accent: #6b3fa0;      /* cresyl violet (Nissl stain) */
  --accent-soft: #ece4f6;
  --good: #1f7a5a;
  --good-soft: #e1f2ea;
  --bad: #b8325a;         /* eosin */
  --bad-soft: #f8e3ea;
  --trace: #6b3fa0;
  --f-display: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12101a; --panel: #1b1826; --ink: #ece8f4; --muted: #a59db4; --line: #312c40;
    --accent: #b591ec; --accent-soft: #2a2140; --good: #5fd3a6; --good-soft: #15302a;
    --bad: #f07fa0; --bad-soft: #3a1a26; --trace: #b591ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12101a; --panel: #1b1826; --ink: #ece8f4; --muted: #a59db4; --line: #312c40;
  --accent: #b591ec; --accent-soft: #2a2140; --good: #5fd3a6; --good-soft: #15302a;
  --bad: #f07fa0; --bad-soft: #3a1a26; --trace: #b591ec; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.stats { display: flex; gap: 14px; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
.atp { letter-spacing: 2px; color: var(--accent); }
.atp .off { color: var(--line); }

/* oscilloscope */
.scope { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 8px 10px 4px; }
.scope-head { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.scope svg { display: block; width: 100%; height: 86px; }

/* zone strip */
.zones { display: flex; gap: 4px; }
.zones span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.zones span.done { background: var(--accent); }
.zones span.now { background: var(--accent); opacity: 0.45; }

.stage { display: grid; gap: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.question { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 6px; }
.question h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.15rem, 3.4vw, 1.4rem); line-height: 1.5; text-wrap: balance; }
.question .zone-sub { color: var(--muted); font-size: 0.85rem; }

.fork { display: block; width: 100%; height: 70px; }
.fork path { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
.fork path.stem { stroke: var(--accent); }
.fork path.go { stroke: var(--accent); stroke-dasharray: 200; stroke-dashoffset: 200; animation: fire 0.45s ease-out forwards; }
.fork path.go.bad { stroke: var(--bad); }
@keyframes fire { to { stroke-dashoffset: 0; } }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.choice {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 22px 22px 8px 8px;
  padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; min-width: 0;
  transition: border-color 0.15s, transform 0.15s, background 0.15s;
}
.choice:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice:disabled { cursor: default; }
.choice .side { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
.choice .txt { font-size: 0.98rem; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.dim { opacity: 0.55; }

.feedback { border-left: 4px solid var(--good); background: var(--panel); border-radius: 0 8px 8px 0; padding: 14px 18px; display: grid; gap: 8px; }
.feedback.bad { border-left-color: var(--bad); }
.feedback .verdict { font-weight: 600; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 0; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer; justify-self: start;
  background: var(--accent); color: var(--panel); border: 0; border-radius: 6px; padding: 10px 18px;
}
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.hint { color: var(--muted); font-size: 0.8rem; font-family: var(--f-mono); }
kbd { font-family: var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }

/* intro + result */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px 22px; display: grid; gap: 14px; }
.card h2 { margin: 0; font-family: var(--f-display); font-size: 1.45rem; text-wrap: balance; }
.card p { margin: 0; max-width: 62ch; }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.route { display: flex; flex-wrap: wrap; gap: 6px; }
.route span { font-size: 0.8rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.big { font-family: var(--f-mono); font-size: 2.2rem; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.1; }
.review { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.review li { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.review .q { font-weight: 600; }
.review .ans { color: var(--good); font-size: 0.92rem; }
.review .why { color: var(--muted); font-size: 0.9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

@media (max-width: 540px) {
  .choices { grid-template-columns: 1fr; }
  .fork { height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .fork path.go { animation: none; stroke-dashoffset: 0; }
  .choice { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>신경 <em>갈림길</em></h1>
    <div class="stats" aria-live="polite">
      <span>ATP <span class="atp" id="atp"></span></span>
      <span>갈림길 <b id="stepNo">0</b>/<b id="stepTotal">16</b></span>
      <span>점수 <b id="score">0</b></span>
    </div>
  </header>

  <section class="scope" aria-label="막전위 기록">
    <div class="scope-head"><span>V<sub>m</sub> 기록 · 전류고정</span><span id="scopeNote">+40 / −70 mV</span></div>
    <svg id="scope" viewBox="0 0 640 86" preserveAspectRatio="none" aria-hidden="true"></svg>
  </section>
  <div class="zones" id="zones" aria-hidden="true"></div>

  <main id="main"></main>
</div>

<script>
// ───────── 문제 데이터: 8개 구역 × 여러 문항. a = 정답, b = 오답, why = 해설 ─────────
const ZONES = [
  { name: "막전위와 활동전위", sub: "수상돌기 → 축삭둔덕", qs: [
    { q: "휴지막전위(약 −70 mV)를 만드는 데 가장 크게 기여하는 것은?",
      a: "휴지 상태에서 열려 있는 K⁺ 누출 통로를 통한 K⁺ 유출",
      b: "Na⁺/K⁺-ATPase가 3:2로 이온을 옮기며 직접 만드는 전위차",
      why: "휴지막은 K⁺ 투과도가 가장 높아 막전위가 E_K(약 −90 mV) 쪽으로 끌려간다. 펌프의 기전성(electrogenic) 기여는 수 mV 정도이고, 펌프의 주된 역할은 농도 기울기 유지다." },
    { q: "세포 밖 K⁺ 농도가 정상보다 높아지면(고칼륨혈증) 뉴런의 휴지막전위는?",
      a: "탈분극된다 (덜 음수가 된다)",
      b: "과분극된다 (더 음수가 된다)",
      why: "Nernst 식에서 [K⁺]out이 커지면 E_K가 덜 음수가 되고, K⁺에 가장 투과적인 휴지막도 함께 탈분극된다. 지속되면 Na⁺ 통로 비활성화로 오히려 흥분성이 떨어진다." },
    { q: "활동전위 직후 아무리 큰 자극을 줘도 새 활동전위가 생기지 않는 절대 불응기의 주원인은?",
      a: "전압개폐 Na⁺ 통로의 비활성화 게이트(h gate)가 닫혀 있음",
      b: "전압개폐 K⁺ 통로가 모두 닫혀 있음",
      why: "비활성화된 Na⁺ 통로는 막이 재분극되어야 회복된다. 지연 정류 K⁺ 통로가 열려 있는 것은 상대 불응기(과분극 후전위)에 기여한다." },
    { q: "도약 전도에서 전압개폐 Na⁺ 통로가 밀집해 있는 곳은?",
      a: "랑비에 결절",
      b: "수초로 덮인 결절 사이(internode)",
      why: "수초는 막 정전용량을 줄이고 막저항을 높여 전류가 결절 사이를 빠르게 건너뛰게 한다. 재생은 Na⁺ 통로가 몰린 결절에서만 일어난다." },
    { q: "활동전위 정점에서 막전위가 E_Na(약 +55 mV) 쪽으로 다가가는 이유는?",
      a: "Na⁺ 투과도가 K⁺ 투과도보다 일시적으로 훨씬 커지기 때문",
      b: "Na⁺ 농도 기울기가 일시적으로 역전되기 때문",
      why: "Goldman–Hodgkin–Katz 식에서 막전위는 투과도의 가중 평균이다. 한 번의 활동전위로 이동하는 이온 수는 극히 적어 농도 기울기는 거의 변하지 않는다." },
    { q: "무수 축삭의 지름이 커지면 전도 속도는?",
      a: "빨라진다",
      b: "느려진다",
      why: "지름이 커지면 축삭 내부 저항이 줄어 길이상수(λ)가 커진다. 그래서 오징어 거대축삭처럼 굵은 축삭은 수초 없이도 빠르다(무수 축삭에서 속도 ∝ √지름)." },
  ]},
  { name: "시냅스 전달", sub: "축삭 말단", qs: [
    { q: "축삭 말단에서 신경전달물질 방출을 직접 촉발하는 이온 유입은?",
      a: "전압개폐 Ca²⁺ 통로를 통한 Ca²⁺ 유입",
      b: "전압개폐 Na⁺ 통로를 통한 Na⁺ 유입",
      why: "활동전위가 활성대(active zone)의 Ca²⁺ 통로를 열고, 국소적으로 치솟은 Ca²⁺가 소포 융합을 일으킨다. Na⁺ 통로를 TTX로 막아도 말단을 직접 탈분극시키면 방출은 일어난다." },
    { q: "시냅스 소포 융합에서 Ca²⁺ 센서 역할을 하는 단백질은?",
      a: "시냅토태그민(synaptotagmin)",
      b: "시냅신(synapsin)",
      why: "시냅토태그민의 C2 도메인이 Ca²⁺와 결합해 SNARE 복합체의 융합을 촉발한다. 시냅신은 예비 풀 소포를 액틴 골격에 묶어 두는 단백질이다." },
    { q: "보툴리눔 독소가 근육 마비를 일으키는 기전은?",
      a: "SNARE 단백질을 잘라 아세틸콜린 방출을 막는다",
      b: "아세틸콜린에스터레이스를 억제해 ACh가 쌓이게 한다",
      why: "보툴리눔·파상풍 독소는 SNAP-25·시냅토브레빈 등을 자르는 단백질분해효소다. 콜린에스터레이스 억제는 유기인계 살충제·신경작용제의 기전이다." },
    { q: "한 시냅스에서 짧은 간격으로 연달아 생긴 EPSP가 겹쳐 커지는 현상은?",
      a: "시간적 합산",
      b: "공간적 합산",
      why: "시간적 합산은 막 시간상수(τ) 안에 다음 입력이 도착할 때 일어난다. 공간적 합산은 서로 다른 위치의 시냅스 입력이 동시에 더해지는 것이다." },
    { q: "신경근 접합부에서 자발적으로 생기는 미니 종판전위(mEPP)는 무엇에 해당하나?",
      a: "소포 하나에 든 ACh가 만드는 반응 (1양자)",
      b: "운동뉴런 활동전위 한 번이 만드는 반응",
      why: "Katz는 유발 EPP 크기가 mEPP의 정수배로 분포함을 보여 양자 가설을 세웠다. 활동전위 한 번은 수백 개 소포를 방출한다." },
    { q: "전기적 시냅스의 구조적 실체는?",
      a: "코넥신으로 이루어진 간극 연접",
      b: "리간드 개폐 이온 통로",
      why: "코넥신 6개가 코넥손을 이루고, 두 세포의 코넥손이 맞붙어 이온이 직접 통과한다. 지연이 거의 없고 양방향이며 뉴런 집단의 동기화에 쓰인다." },
  ]},
  { name: "신경전달물질과 수용체", sub: "시냅스 틈", qs: [
    { q: "NMDA 수용체가 이온을 통과시키려면 무엇이 필요한가?",
      a: "글루탐산(+글라이신) 결합과, Mg²⁺ 차단을 풀어 줄 탈분극이 동시에",
      b: "글루탐산 결합만 있으면 된다",
      why: "휴지 전위에서는 Mg²⁺가 통로 구멍을 막는다. 그래서 NMDA 수용체는 시냅스전·후 활동이 동시에 있을 때만 열리는 '일치 검출기'로 작동한다." },
    { q: "GABA_A 수용체의 정체는?",
      a: "Cl⁻를 통과시키는 이온성(리간드 개폐) 수용체",
      b: "G단백질을 거쳐 K⁺ 통로(GIRK)를 여는 대사성 수용체",
      why: "GABA_A는 오량체 Cl⁻ 통로로 빠른 IPSP를 만든다. GIRK를 여는 느린 억제는 대사성인 GABA_B 수용체의 작용이다." },
    { q: "벤조디아제핀의 작용 기전은?",
      a: "GABA_A 수용체에 알로스테릭하게 결합해 GABA의 효과를 키운다",
      b: "GABA 재흡수 수송체를 막아 시냅스의 GABA를 늘린다",
      why: "벤조디아제핀은 α와 γ 소단위 사이에 결합해 GABA가 있을 때 통로 개방 빈도를 늘린다. GABA 없이는 통로를 열지 못한다. 재흡수 억제는 티아가빈(GAT-1 억제제)의 기전이다." },
    { q: "SSRI(예: 플루옥세틴)의 1차 표적은?",
      a: "세로토닌 수송체(SERT)",
      b: "모노아민 산화효소(MAO)",
      why: "SSRI는 SERT를 막아 시냅스 틈의 세로토닌을 늘린다. MAO 억제제는 별개의 항우울제 계열이다. 임상 효과가 몇 주 늦게 나타나는 것은 수용체 적응 때문으로 여겨진다." },
    { q: "이온성 수용체와 비교한 대사성(GPCR) 수용체 반응의 특징은?",
      a: "느리게 시작하고 더 오래 지속되며 2차 전달자로 신호가 증폭된다",
      b: "밀리초 안에 시작하고 더 빨리 끝난다",
      why: "GPCR은 G단백질, 효소, 2차 전달자를 차례로 거쳐 수십 ms~수 초에 걸쳐 작용한다. 대신 한 수용체가 많은 분자를 활성화해 신호가 증폭된다." },
    { q: "도파민 D1 수용체가 활성화되면 세포 안 cAMP는?",
      a: "증가한다 (Gs/olf 연결)",
      b: "감소한다 (Gi/o 연결)",
      why: "D1 계열(D1, D5)은 아데닐산 고리화효소를 자극한다. D2 계열(D2–D4)은 Gi/o를 거쳐 억제한다. 선조체의 직접/간접 경로가 이 차이로 나뉜다." },
  ]},

const PER_ZONE = 2;
const MAX_ATP = 3;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let S = null; // game state

function newRun() {
  const steps = [];
  ZONES.forEach((z, zi) => shuffle(z.qs).slice(0, PER_ZONE).forEach((q) => steps.push({ zi, ...q, left: Math.random() < 0.5 ? "a" : "b" })));
  return { phase: "play", steps, i: 0, atp: MAX_ATP, score: 0, streak: 0, best: 0, picked: null, log: [] };
}

function renderStats() {
  const total = S ? S.steps.length : ZONES.length * PER_ZONE;
  const atp = S ? S.atp : MAX_ATP;
  $("atp").innerHTML = "●".repeat(atp) + '<span class="off">' + "●".repeat(MAX_ATP - atp) + "</span>";
  $("stepNo").textContent = S && S.phase !== "intro" ? Math.min(S.i + 1, total) : 0;
  $("stepTotal").textContent = total;
  $("score").textContent = S ? S.score : 0;
  const zi = S && S.phase === "play" ? S.steps[S.i].zi : -1;
  $("zones").innerHTML = ZONES.map((_, k) => {
    const cls = S && (S.phase === "end" ? k <= (S.steps[Math.min(S.i, S.steps.length - 1)] || {}).zi : k < zi) ? "done" : k === zi ? "now" : "";
    return `<span class="${cls}"></span>`;
  }).join("");
  renderScope();
}

// 막전위 기록: 정답 = 활동전위, 오답 = 역치하 EPSP
function renderScope() {
  const W = 640, H = 86, total = S ? S.steps.length : 16, slot = W / (total + 1);
  const y = (mv) => H - 6 - ((mv + 80) / 125) * (H - 12);
  let d = `M0 ${y(-70)}`;
  const log = S ? S.log : [];
  log.forEach((e, k) => {
    const x = slot * (k + 0.6);
    if (e.ok) d += ` L${x} ${y(-70)} L${x + 4} ${y(-55)} L${x + 9} ${y(40)} L${x + 15} ${y(-80)} L${x + 26} ${y(-70)}`;
    else d += ` L${x} ${y(-70)} L${x + 6} ${y(-61)} L${x + 22} ${y(-70)}`;
  });
  d += ` L${W} ${y(-70)}`;
  const grid = [-70, -55, 0, 40].map((mv) => `<line x1="0" x2="${W}" y1="${y(mv)}" y2="${y(mv)}" stroke="var(--line)" stroke-width="1" ${mv === -55 ? 'stroke-dasharray="4 4"' : ""}/>`).join("");
  $("scope").innerHTML = grid + `<path d="${d}" fill="none" stroke="var(--trace)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  const fired = log.filter((e) => e.ok).length;
  $("scopeNote").textContent = S && log.length ? `스파이크 ${fired} · 실패 ${log.length - fired}` : "+40 / −70 mV · 점선 = 역치";
}

function renderIntro() {
  $("main").innerHTML = `
    <section class="card">
      <span class="eyebrow">대학 신경과학 · 갈림길 ${ZONES.length * PER_ZONE}개</span>
      <h2>당신은 축삭둔덕에서 막 발화한 활동전위입니다</h2>
      <p>축삭이 갈라지는 곳마다 두 갈래 중 하나를 골라야 해요. 맞는 갈래로 가면 신호가 다음 구역으로 전도되고, 틀린 갈래로 가면 역치에 못 미쳐 ATP를 하나 잃어요.</p>
      <ul class="rules">
        <li>ATP ${MAX_ATP}개가 모두 떨어지면 신호가 끊겨요.</li>
        <li>정답 10점, 연속으로 맞히면 보너스가 붙어요.</li>
        <li>고를 때마다 해설이 나오고, 끝나면 틀린 문제를 다시 볼 수 있어요.</li>
      </ul>
      <div class="route">${ZONES.map((z) => `<span>${esc(z.name)}</span>`).join("")}</div>
      <button class="btn" id="startBtn" type="button">발화 시작</button>
      <span class="hint"><kbd>←</kbd> <kbd>→</kbd> 로 갈래 선택 · <kbd>Enter</kbd> 로 다음</span>
    </section>`;
  $("startBtn").onclick = start;
}

function forkSvg(dir, ok) {
  const L = "M160 4 C160 40, 70 40, 70 66", R = "M160 4 C160 40, 250 40, 250 66";
  return `<svg class="fork" viewBox="0 0 320 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="${L}"/><path d="${R}"/>
    ${dir ? `<path class="go ${ok ? "" : "bad"}" d="${dir === "L" ? L : R}"/>` : ""}
  </svg>`;
}

function renderStep() {
  const st = S.steps[S.i], z = ZONES[st.zi];
  const sides = [["L", st.left], ["R", st.left === "a" ? "b" : "a"]];
  const picked = S.picked; // { side, ok } or null
  $("main").innerHTML = `
    <div class="stage">
      <section class="question">
        <span class="eyebrow">구역 ${st.zi + 1} · ${esc(z.name)}</span>
        <h2>${esc(st.q)}</h2>
        <span class="zone-sub">${esc(z.sub)}</span>
      </section>
      ${forkSvg(picked && picked.side, picked && picked.ok)}
      <div class="choices">
        ${sides.map(([side, key]) => {
          let cls = "";
          if (picked) cls = key === "a" ? "right" : side === picked.side ? "wrong" : "dim";
          return `<button class="choice ${cls}" type="button" data-side="${side}" ${picked ? "disabled" : ""}>
            <span class="side">${side === "L" ? "← 왼쪽 가지" : "오른쪽 가지 →"}</span>
            <span class="txt">${esc(st[key])}</span>
          </button>`;
        }).join("")}
      </div>
    </div>
    ${picked ? `
    <section class="feedback ${picked.ok ? "good" : "bad"}" aria-live="polite">
      <span class="verdict">${picked.ok ? `전도 성공 · +${picked.gain}점${S.streak > 1 ? ` (연속 ${S.streak})` : ""}` : "역치 미달 · ATP −1"}</span>
      <p>${esc(st.why)}</p>
      <button class="btn" id="nextBtn" type="button">${S.atp === 0 ? "기록 보기" : S.i + 1 >= S.steps.length ? "시냅스 도착 · 결과 보기" : "다음 갈림길"}</button>
    </section>` : `<span class="hint"><kbd>←</kbd> <kbd>→</kbd> 로도 고를 수 있어요</span>`}`;
  document.querySelectorAll(".choice").forEach((b) => (b.onclick = () => choose(b.dataset.side)));
  if (picked) { const n = $("nextBtn"); n.onclick = next; n.focus({ preventScroll: true }); }
}

function choose(side) {
  if (!S || S.phase !== "play" || S.picked) return;
  const st = S.steps[S.i];
  const key = side === "L" ? st.left : st.left === "a" ? "b" : "a";
  const ok = key === "a";
  let gain = 0;
  if (ok) { S.streak++; S.best = Math.max(S.best, S.streak); gain = 10 + (S.streak - 1) * 2; S.score += gain; }
  else { S.streak = 0; S.atp--; }
  S.log.push({ ok, idx: S.i });
  S.picked = { side, ok, gain };
  render();
}

function next() {
  if (!S.picked) return;
  S.picked = null;
  if (S.atp === 0 || S.i + 1 >= S.steps.length) { S.phase = "end"; render(); return; }
  S.i++;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderEnd() {
  const n = S.log.length, okN = S.log.filter((e) => e.ok).length;
  const finished = S.atp > 0;
  const missed = S.log.filter((e) => !e.ok).map((e) => S.steps[e.idx]);
  const grade = !finished ? "전도 차단" : okN === n ? "완벽한 도약 전도" : okN / n >= 0.8 ? "빠른 유수 섬유" : okN / n >= 0.6 ? "무수 C 섬유 속도" : "간신히 역치 도달";
  $("main").innerHTML = `
    <section class="card">
      <span class="eyebrow">${finished ? "축삭 말단 도착" : `구역 ${S.steps[S.i].zi + 1}에서 신호 소실`}</span>
      <h2>${grade}</h2>
      <div class="row" style="gap:28px">
        <div><div class="big">${S.score}</div><span class="hint">점수</span></div>
        <div><div class="big">${okN}/${n}</div><span class="hint">맞힌 갈림길</span></div>
        <div><div class="big">${S.best}</div><span class="hint">최고 연속</span></div>
      </div>
      ${missed.length ? `<h3 style="margin:6px 0 0;font-size:1rem">다시 볼 개념</h3>
      <ol class="review">${missed.map((m) => `<li><span class="q">${esc(m.q)}</span><span class="ans">정답 · ${esc(m.a)}</span><span class="why">${esc(m.why)}</span></li>`).join("")}</ol>`
      : `<p>틀린 갈림길이 없어요. 다시 하면 다른 문제가 섞여 나와요.</p>`}
      <div class="row">
        <button class="btn" id="againBtn" type="button">다시 발화</button>
        ${missed.length ? `<button class="btn ghost" id="retryBtn" type="button">틀린 문제만 다시</button>` : ""}
      </div>
    </section>`;
  $("againBtn").onclick = start;
  if (missed.length) $("retryBtn").onclick = () => {
    S = { phase: "play", steps: shuffle(missed).map((m) => ({ ...m, left: Math.random() < 0.5 ? "a" : "b" })), i: 0, atp: MAX_ATP, score: 0, streak: 0, best: 0, picked: null, log: [] };
    render();
  };
}

function render() {
  renderStats();
  if (!S || S.phase === "intro") renderIntro();
  else if (S.phase === "play") renderStep();
  else renderEnd();
}
function start() { S = newRun(); render(); window.scrollTo({ top: 0 }); }

document.addEventListener("keydown", (e) => {
  if (!S || S.phase !== "play" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (!S.picked && (e.key === "ArrowLeft" || e.key === "1")) { e.preventDefault(); choose("L"); }
  else if (!S.picked && (e.key === "ArrowRight" || e.key === "2")) { e.preventDefault(); choose("R"); }
});

// 아티팩트 뷰어가 페이지를 갱신해도 진행 상태를 유지
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = (data) => { S = (data && data.S) || null; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
